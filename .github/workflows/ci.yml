name: Initial Database Validation

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - qa
      - main

jobs:
  validate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate database folder structure
        run: |
          echo "Validating database structure..."
          test -d "entregables/estructura-base-datos" && echo "OK: entregables exist" || echo "WARN: entregables not yet created"

      - name: Done
        run: echo "HU-05 CI validation complete"
